<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com">
    <meta charset="UTF-8">
    <title>Financial Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="Titulo">Meu Controle de Gastos</h1>
    <div id="container">
        
        <div id="expense-log" class="card-top-config card-config">
            <p>Log de Gastos</p>
            <ul id="list-expense">
                <li class="li-expense">
                    <a href="#" class="expense-link">
                        <span class="value">R$ 150,00</span>
                        <span class="type-expense">Combutivel</span>
                    </a>
                </li>
                <li class="li-expense">
                    <a href="#" class="expense-link">
                        <span class="value">R$ 70,00</span>
                        <span class="type-expense">Mercado</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <div id="all-expense" class="card-top-config card-config">
            <p id="label-all-expense">Total de Gastos(Mês)</p>
            <p id="all-expense-value">R$1.250,00</p>
        </div>

        <form id="expense-form">
            <div class="card-botton-config">
                <label for="expense-value">Valor Gasto</label>
                <input type="number" id="expense-value" placeholder="Digite o valor do gasto">
            </div>
            <div class="card-botton-config">
                <label for="expense-type">Categoria do Gasto</label>
                <select id="expense-category">
                    <option value="" disabled selected>Selecione uma Categoria</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Moradia">Moradia</option>
                </select>
            </div>
            <button id="add-expense-btn" class="scale-up-center" type="submit">Adicionar Gasto</button>
        </form>
        
        <div id="expense-grafic" class="card-config">
            <canvas id="pie-grafic" width="380" height="370"></canvas>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
