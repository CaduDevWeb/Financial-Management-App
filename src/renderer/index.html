<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Financial Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="Titulo">Meu Controle de Gastos</h1>
    <div id="container">
        
        <div id="expense-log" class="card-top-config card-config">
            <button class="btn"></button>
            <span>$</span>
        </div>
        
        <div id="all-expense" class="card-top-config card-config">
            <p id="label-all-expense">Total de Gastos(Mês)</p>
            <p id="all-expense-value">R$1.250,00</p>
        </div>

        <form id="expense-form">
            <label for="expense-value">Valor Gasto</label>
            <input type="number" id="expense-value" placeholder="Digite o valor do gasto">
            <label for="expense-type">Tipo/Categoria do Gasto</label>
            <select id="expense-category">
                <option value="" disabled selected>Selecione uma Categoria</option>
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Lazer">Lazer</option>
                <option value="Moradia">Moradia</option>
            </select>
            <button id="add-expense-btn" type="submit">Adicionar Gasto</button>
        </form>
        
        <div id="expense-grafic" class="card-config">
            <canvas id="pie-grafic" width="400" height="400"></canvas>
        </div>
    </div>
</body>
</html>
