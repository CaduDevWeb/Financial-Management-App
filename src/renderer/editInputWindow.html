<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-config">
        <h1 id="Titulo">Edição de Valores</h1>
        <div>
            <p id="oldValue"></p>
            <p id="oldType"></p>
        </div>
        <form id="expense-form">
            <div class="card-botton-config">
                <label for="expense-value">Valor Gasto</label>
                <input type="number" id="expense-value" name="expense-value" placeholder="Digite o valor do gasto" required>
            </div>
            <div class="card-botton-config">
                <label for="expense-type">Categoria do Gasto</label>
                <select id="expense-category" name="expense-category" required>
                    <option value="" disabled selected>Selecione uma Categoria</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Moradia">Moradia</option>
                </select>
            </div>
            <button id="add-expense-btn" class="scale-up-center" type="submit">Confirmar Alteração</button>
        </form>
    </div>
    <script src="./editInputWindow.js"></script>
</body>
</html>
